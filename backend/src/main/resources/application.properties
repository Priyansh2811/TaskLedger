spring.application.name=ledger-todo

# File-based H2 database so data survives restarts (change to Postgres/MySQL for production)
spring.datasource.url=jdbc:h2:file:./data/ledger;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Optional H2 console for inspecting data during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
